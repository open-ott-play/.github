name: Profile links
'on':
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: 17 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  links:
    name: Profile links and diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check every profile link, anchor and diagram
        id: check
        run: python3 scripts/check-profile.py --report profile-links-report.md
      - name: Open or update the broken-link issue
        if: failure() && github.event_name == 'schedule' && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: profile-links-report.md
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ]; then
            echo "The check failed without a link report; nothing to file."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          {
            echo "The scheduled Profile links check failed: $run_url"
            echo
            echo "Commit: $commit_url"
            echo
            cat "$REPORT"
            echo
            echo "This issue is updated on every scheduled failure and closed automatically once the check passes again."
          } > issue-body.md
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq 'first(.[] | select(.title == "Profile links check is failing") | .number) // ""')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
            echo "Updated issue #$number"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Profile links check is failing" --body-file issue-body.md
          fi
      - name: Close the broken-link issue after a passing run
        if: github.event_name == 'schedule' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title == "Profile links check is failing") | .number' \
          | while read -r number; do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "The scheduled Profile links check passed again: $run_url"
            echo "Closed issue #$number"
          done

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Open OTT Play</title>
  <desc id="bannerDesc">Open-source IPTV/OTT player software. Your playlists, your accounts. M3U, Xtream and Stalker sources, HLS and DASH playback, 88 interface languages.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1c33"/>
      <stop offset="1" stop-color="#122a44"/>
    </linearGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132742"/>
      <stop offset="1" stop-color="#0a1729"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.4"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1012" cy="150" r="270" fill="url(#glow)"/>

    <!-- signal motif -->
    <g fill="none" stroke="#22d3ee">
      <circle cx="1012" cy="150" r="114" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 10"/>
      <circle cx="1012" cy="150" r="86" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="1012" cy="150" r="58" stroke-opacity="0.28" stroke-width="1.5"/>
    </g>
    <path d="M990 118 L1052 150 L990 182 Z" fill="#22d3ee" opacity="0.55" filter="url(#softGlow)"/>
    <path d="M990 118 L1052 150 L990 182 Z" fill="url(#play)" opacity="0.95"/>

    <!-- mark -->
    <g transform="translate(64,84)">
      <rect width="92" height="92" rx="22" fill="url(#markBg)" stroke="#1e3a5f" stroke-width="1.5"/>
      <path d="M32 30 L46 14 L60 30" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="14" y="30" width="64" height="48" rx="10" fill="none" stroke="#e2e8f0" stroke-width="4"/>
      <path d="M40 41 L60 54 L40 67 Z" fill="url(#play)"/>
    </g>

    <!-- wordmark -->
    <text x="184" y="128" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.6" fill="#f8fafc">Open OTT Play</text>
    <text x="184" y="164" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">Open-source IPTV/OTT player software — your playlists, your accounts.</text>

    <!-- chips -->
    <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      <g>
        <rect x="184" y="186" width="196" height="34" rx="17" fill="#0e1b31" stroke="#1e3a5f"/>
        <text x="282" y="208" text-anchor="middle" fill="#7dd3fc">M3U · Xtream · Stalker</text>
      </g>
      <g>
        <rect x="392" y="186" width="118" height="34" rx="17" fill="#0e1b31" stroke="#1e3a5f"/>
        <text x="451" y="208" text-anchor="middle" fill="#7dd3fc">HLS · DASH</text>
      </g>
      <g>
        <rect x="522" y="186" width="208" height="34" rx="17" fill="#0e1b31" stroke="#1e3a5f"/>
        <text x="626" y="208" text-anchor="middle" fill="#7dd3fc">88 interface languages</text>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="25.25" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Open OTT Play architecture</title>
  <desc id="archDesc">Three players (ottplay-foss, ottplay-android, ottplay-roku) consume the shared ottplay-core domain and wire contracts. Optional self-hosted companions are ottplay-control-server, ottplay-swop and the outpace-acestream engine.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f1c33"/>
      <stop offset="1" stop-color="#122a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d242c"/>
      <stop offset="1" stop-color="#0e1b31"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="conn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L9 5 L1.5 8.5" fill="none" stroke="#3b6a96" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="frame">
      <rect width="1200" height="760" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="760" fill="url(#bg)"/>
    <rect width="1200" height="760" fill="url(#grid)"/>
    <circle cx="600" cy="430" r="360" fill="url(#glow)"/>

    <!-- header -->
    <text x="56" y="82" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.4" fill="#f8fafc">How the pieces fit</text>
    <text x="56" y="114" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">One shared domain core, three native players, and optional companions you host yourself.</text>

    <!-- section label -->
    <text x="56" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.4" fill="#7dd3fc">PLAYERS</text>

    <!-- player cards -->
    <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
      <g>
        <rect x="56" y="184" width="344" height="132" rx="16" fill="#0e1b31" stroke="#1e3a5f"/>
        <circle cx="82" cy="214" r="4.5" fill="#22d3ee"/>
        <text x="96" y="222" font-size="19" font-weight="600" fill="#e2e8f0">ottplay-foss</text>
        <text x="80" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">JavaScript · Rust local server</text>
        <text x="80" y="278" font-size="12.5" fill="#94a3b8">webOS · Tizen · Android TV · MAG · Dune</text>
        <text x="80" y="300" font-size="12.5" fill="#64748b">EPG · catch-up · 88 interface languages</text>
      </g>
      <g>
        <rect x="428" y="184" width="344" height="132" rx="16" fill="#0e1b31" stroke="#1e3a5f"/>
        <circle cx="454" cy="214" r="4.5" fill="#22d3ee"/>
        <text x="468" y="222" font-size="19" font-weight="600" fill="#e2e8f0">ottplay-android</text>
        <text x="452" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">Kotlin · Compose · Media3</text>
        <text x="452" y="278" font-size="12.5" fill="#94a3b8">phones, tablets and Android TV</text>
        <text x="452" y="300" font-size="12.5" fill="#64748b">native app · 20 interface languages</text>
      </g>
      <g>
        <rect x="800" y="184" width="344" height="132" rx="16" fill="#0e1b31" stroke="#1e3a5f"/>
        <circle cx="826" cy="214" r="4.5" fill="#22d3ee"/>
        <text x="840" y="222" font-size="19" font-weight="600" fill="#e2e8f0">ottplay-roku</text>
        <text x="824" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">BrightScript · SceneGraph</text>
        <text x="824" y="278" font-size="12.5" fill="#94a3b8">Roku players and Roku TVs</text>
        <text x="824" y="300" font-size="12.5" fill="#64748b">sideload ZIP · separate release cycle</text>
      </g>
    </g>

    <!-- clients to core connectors -->
    <g stroke="#3b6a96" stroke-width="1.5">
      <line x1="228" y1="320" x2="228" y2="368" marker-start="url(#conn)" marker-end="url(#conn)"/>
      <line x1="600" y1="320" x2="600" y2="368" marker-start="url(#conn)" marker-end="url(#conn)"/>
      <line x1="972" y1="320" x2="972" y2="368" marker-start="url(#conn)" marker-end="url(#conn)"/>
    </g>

    <!-- core bar -->
    <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
      <rect x="56" y="372" width="1088" height="118" rx="16" fill="url(#coreFill)" stroke="#1f4a44"/>
      <rect x="56" y="372" width="5" height="118" rx="2.5" fill="#34d399"/>
      <text x="88" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.2" fill="#34d399">SHARED CORE</text>
      <text x="88" y="428" font-size="22" font-weight="600" fill="#e2e8f0">ottplay-core</text>
      <text x="88" y="454" font-size="12.5" fill="#94a3b8">M3U, Xtream and Stalker sessions · channel identity · XMLTV guides · catch-up rules</text>
      <text x="88" y="474" font-size="12.5" fill="#94a3b8">favorites and history · settings portability · parental gates · playback targets</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
        <rect x="874" y="414" width="62" height="24" rx="12" fill="#0b1f24" stroke="#1f4a44"/>
        <text x="905" y="430" text-anchor="middle" fill="#6ee7b7">JVM JAR</text>
        <rect x="944" y="414" width="38" height="24" rx="12" fill="#0b1f24" stroke="#1f4a44"/>
        <text x="963" y="430" text-anchor="middle" fill="#6ee7b7">ES5</text>
        <rect x="990" y="414" width="122" height="24" rx="12" fill="#0b1f24" stroke="#1f4a44"/>
        <text x="1051" y="430" text-anchor="middle" fill="#6ee7b7">contracts v1</text>
      </g>
    </g>

    <!-- core to companions (generated contracts) -->
    <g stroke="#3b6a96" stroke-width="1.5" stroke-dasharray="5 6">
      <line x1="228" y1="494" x2="228" y2="546" marker-end="url(#conn)"/>
      <line x1="600" y1="494" x2="600" y2="546" marker-end="url(#conn)"/>
    </g>
    <text x="612" y="526" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">generated wire contracts</text>

    <!-- section label -->
    <text x="56" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.4" fill="#fbbf24">OPTIONAL COMPANIONS</text>

    <!-- companion cards -->
    <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
      <g>
        <rect x="56" y="556" width="344" height="132" rx="16" fill="#0e1b31" stroke="#3d3218"/>
        <circle cx="82" cy="586" r="4.5" fill="#fbbf24"/>
        <text x="96" y="594" font-size="19" font-weight="600" fill="#e2e8f0">ottplay-control-server</text>
        <text x="80" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#fcd34d">Go server · Python CLI</text>
        <text x="80" y="650" font-size="12.5" fill="#94a3b8">outbound queues, Helm chart, binaries</text>
        <text x="80" y="672" font-size="12.5" fill="#64748b">terminal remote · Home Assistant banners</text>
      </g>
      <g>
        <rect x="428" y="556" width="344" height="132" rx="16" fill="#0e1b31" stroke="#3d3218"/>
        <circle cx="454" cy="586" r="4.5" fill="#fbbf24"/>
        <text x="468" y="594" font-size="19" font-weight="600" fill="#e2e8f0">ottplay-swop</text>
        <text x="452" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#fcd34d">Cloudflare Worker · KV</text>
        <text x="452" y="650" font-size="12.5" fill="#94a3b8">phone types, TV polls and burns the code</text>
        <text x="452" y="672" font-size="12.5" fill="#64748b">one-time text entry, no per-TV allowlist</text>
      </g>
      <g>
        <rect x="800" y="556" width="344" height="132" rx="16" fill="#0e1b31" stroke="#3d3218"/>
        <circle cx="826" cy="586" r="4.5" fill="#fbbf24"/>
        <text x="840" y="594" font-size="19" font-weight="600" fill="#e2e8f0">outpace-acestream</text>
        <text x="824" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#fcd34d">Rust · AGPL-3.0-or-later</text>
        <text x="824" y="650" font-size="12.5" fill="#94a3b8">AceStream to MPEG-TS and HLS</text>
        <text x="824" y="672" font-size="12.5" fill="#64748b">Docker, Kubernetes, any HTTP player</text>
      </g>
    </g>

    <text x="56" y="722" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">Companions are optional, self-hosted and configured separately from playback. Passing CI is not device or provider acceptance.</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="758.5" rx="25.25" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
</svg>

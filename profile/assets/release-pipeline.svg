<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">Release pipeline</title>
  <desc id="pipeDesc">A reviewed ottplay-foss release passes staged browser acceptance, is verified byte for byte by ottplay-web-vitrine, and is published to the browser demo.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f1c33"/>
      <stop offset="1" stop-color="#122a44"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1.5 1.5 L9 5 L1.5 8.5" fill="none" stroke="#3b6a96" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <text x="56" y="62" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.3" fill="#f8fafc">Release pipeline</text>
    <text x="56" y="90" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">The hosted demo serves reviewed player artifacts — it is never a separate build.</text>

    <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
      <g>
        <rect x="55" y="116" width="250" height="112" rx="14" fill="#0e1b31" stroke="#1e3a5f"/>
        <text x="77" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#22d3ee">01</text>
        <text x="77" y="170" font-size="16" font-weight="600" fill="#e2e8f0">FOSS release</text>
        <text x="77" y="196" font-size="11.5" fill="#94a3b8">signed beta and stable tags</text>
        <text x="77" y="214" font-size="11.5" fill="#64748b">exact-byte artifact manifest</text>
      </g>
      <g>
        <rect x="335" y="116" width="250" height="112" rx="14" fill="#0e1b31" stroke="#1e3a5f"/>
        <text x="357" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#22d3ee">02</text>
        <text x="357" y="170" font-size="16" font-weight="600" fill="#e2e8f0">Staged acceptance</text>
        <text x="357" y="196" font-size="11.5" fill="#94a3b8">six browser scenarios</text>
        <text x="357" y="214" font-size="11.5" fill="#64748b">before any publication</text>
      </g>
      <g>
        <rect x="615" y="116" width="250" height="112" rx="14" fill="#0e1b31" stroke="#1e3a5f"/>
        <text x="637" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#22d3ee">03</text>
        <text x="637" y="170" font-size="16" font-weight="600" fill="#e2e8f0">Web vitrine</text>
        <text x="637" y="196" font-size="11.5" fill="#94a3b8">verifies accepted bytes</text>
        <text x="637" y="214" font-size="11.5" fill="#64748b">publishes, never rebuilds</text>
      </g>
      <g>
        <rect x="895" y="116" width="250" height="112" rx="14" fill="#141029" stroke="#3d3168"/>
        <text x="917" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#a78bfa">04</text>
        <rect x="1063" y="126" width="58" height="20" rx="10" fill="#241b45" stroke="#4c3b7a"/>
        <text x="1092" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#c4b5fd">LIVE</text>
        <text x="917" y="170" font-size="16" font-weight="600" fill="#e2e8f0">Browser demo</text>
        <text x="917" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#c4b5fd">player.ottplay.here.now</text>
        <text x="917" y="214" font-size="11.5" fill="#64748b">no install, no account</text>
      </g>
    </g>

    <g stroke="#3b6a96" stroke-width="1.5">
      <line x1="308" y1="172" x2="328" y2="172" marker-end="url(#step)"/>
      <line x1="588" y1="172" x2="608" y2="172" marker-end="url(#step)"/>
      <line x1="868" y1="172" x2="888" y2="172" marker-end="url(#step)"/>
    </g>

    <text x="56" y="268" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">Android previews and Roku sideload builds ship on their own release channels; they are not part of this web publication path.</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="25.25" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
</svg>
